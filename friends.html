<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>friends - dsplay</title>
    <meta name="description" content="cool people i've met online. check out their sites if you wanna see more indie web stuff.">
    <meta name="theme-color" content="#0f0f0f">
    <link rel="canonical" href="https://dsplay.cc/friends.html">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dsplay.cc/friends.html">
    <meta property="og:title" content="friends - dsplay">
    <meta property="og:description" content="some guys i met along the way">
    <meta property="og:image" content="https://dsplay.cc/og/friends-meta.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="friends - dsplay">
    <meta name="twitter:description" content="some guys i met along the way">
    <meta name="twitter:image" content="https://dsplay.cc/og/friends-meta.png">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
    <link rel="stylesheet" href="styles.css">
    <style>
        .fgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .fcard {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: opacity 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .fcard:hover {
            opacity: 0.8;
        }

        .fbtn {
            width: 88px;
            height: 31px;
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        body:not(.dark-mode) .fbtn {
            border-color: rgba(0, 0, 0, 0.1);
        }

        .load {
            text-align: center;
            color: #cccccc;
            padding: 2rem;
        }

        .nfrds {
            text-align: center;
            color: #999999;
            padding: 2rem;
        }
    </style>
</head>
<body class="dark-mode ui-ready">
    <script>try{if(localStorage.getItem('darkMode')==='disabled')document.body.classList.remove('dark-mode')}catch(e){}</script>
    <main class="wrap">
        <nav class="nav">
            <a href="/" class="logo">dsplay</a>
            <div class="navr">
                <ul class="links">
                    <li><a href="/" data-i18n="nav_home">home</a></li>
                    <li><a href="/passion.html" data-i18n="nav_passions">passions</a></li>
                    <li class="dropc">
                        <button class="dropb" id="dbtn">☰</button>
                        <div class="dropm" id="dmenu">
                            <a href="blogs.html" data-i18n="nav_blogs">blogs</a>
                            <a href="friends.html" data-i18n="nav_friends">friends</a>
                            <a href="passion.html" data-i18n="nav_passions">passion</a>
                            <a href="tastes.html" data-i18n="nav_tastes">tastes</a>
                        </div>
                    </li>
                </ul>
                <div class="acts">
                    <button class="tbtn" id="tbtn" aria-label="Toggle theme">
                        <span class="tico material-symbols-outlined">dark_mode</span>
                    </button>
                    <button class="lbtn" id="lbtn" aria-label="Switch to Thai">🇹🇭</button>
                    <button class="mbtn" id="mbtn" aria-label="Open listening modal">
                        <span class="mic material-symbols-outlined">headphones</span>
                    </button>
                </div>
            </div>
        </nav>

        <section id="frds" class="frds">
            <h1 data-i18n="friends_title">friends</h1>
            
            <div id="fgrid" class="fgrid">
                <a href="https://dsplay.cc" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="88x31.png" class="fbtn" loading="lazy">
                </a>
                <a href="https://barni.one" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="https://barni.one/_astro/banner.DNzFacvo.png" class="fbtn" loading="lazy">
                </a>
                <a href="https://www.tinywifi.cc" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="https://www.tinywifi.cc/images/buttons/tinywifi.png" class="fbtn" loading="lazy">
                </a>
                <a href="https://www.khaodoes.dev" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="https://khaodoes.dev/badges/khao.png" class="fbtn" loading="lazy">
                </a>
                <a href="https://itsnutt.me" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="https://files.catbox.moe/z5fl9q.png" class="fbtn" loading="lazy">
                </a>
            </div>
        </section>

        <p style="text-align: center; margin-top: 3rem; color: #999; font-size: 0.9rem;">&copy; 2026 dsplay</p>
    </main>

    <div class="mback" id="mmod" aria-hidden="true">
        <div class="mmod" role="dialog" aria-modal="true" aria-labelledby="mtit">
            <div class="mhead">
                <p class="mtit" id="mtit" data-i18n="mp_title">Now Playing</p>
                <button class="mclose" id="mclose" aria-label="Close listening modal" data-i18n="mp_close">close</button>
            </div>
            <div class="mbody" id="now" aria-live="polite">
                <img class="mcover is-empty" id="cov" alt="Album cover" loading="lazy">
                <div class="cfb" id="cfb" aria-hidden="true">
                    <span class="material-symbols-outlined">music_note</span>
                </div>
                <div class="mmeta">
                    <p class="ttl" id="ttl">Playing nothing</p>
                    <p class="art" id="art">No track currently playing</p>
                    <a class="src" id="src" href="https://music.youtube.com" target="_blank" rel="noopener noreferrer">
                        <span class="material-symbols-outlined" aria-hidden="true">headphones</span>
                        <span data-i18n="mp_listen">Listen</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const f = [
            { u: "https://dsplay.cc", i: "88x31.png" },
            { u: "https://barni.one", i: "https://barni.one/_astro/banner.DNzFacvo.png" },
            { u: "https://www.tinywifi.cc", i: "https://www.tinywifi.cc/images/buttons/tinywifi.png" },
            { u: "https://www.khaodoes.dev", i: "https://khaodoes.dev/badges/khao.png" },
            { u: "https://itsnutt.me", i: "https://files.catbox.moe/z5fl9q.png" }
        ];

        function r() {
            const c = document.getElementById('fgrid');
            
            if (f.length === 0) {
                const lang = localStorage.getItem('lang') || 'en';
                const emptyText = translations[lang] ? translations[lang].friends_empty : 'No friends yet :(';
                c.innerHTML = '<div class="nfrds">' + emptyText + '</div>';
                return;
            }
            
            c.innerHTML = f.map(x => `
                <a href="${x.u}" class="fcard" target="_blank" rel="noopener noreferrer">
                    <img src="${x.i}" class="fbtn" loading="lazy">
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            r();
        });
    </script>
</body>
</html>
